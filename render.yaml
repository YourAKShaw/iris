# Render Blueprint: deploys the Iris web app on Render's free plan.
# Render prompts for LLM_API_KEY when you create the Blueprint (sync: false keeps it out of git).
# Free instances sleep after 15 minutes without traffic and take about a minute to wake.
services:
  - type: web
    name: iris
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: SENDER_NAME
        value: Ayush
      - key: SENDER_COMPANY
        value: NayaManas
      - key: DAILY_RUN_LIMIT
        value: "25"
      - key: RATE_LIMIT_PER_IP
        value: "5"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
